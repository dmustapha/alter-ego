  <!-- Pink offset layer -->
  <text x="78" y="44" font-family="'Press Start 2P', monospace" font-size="20" font-weight="400" fill="#ff2d95" opacity="0.2" letter-spacing="4" transform="translate(-2,2)">ALTER EGO</text>
  <!-- Main text -->
  <text x="80" y="44" font-family="'Press Start 2P', monospace" font-size="20" font-weight="400" fill="#f0f0ff" letter-spacing="4">ALTER EGO</text>
